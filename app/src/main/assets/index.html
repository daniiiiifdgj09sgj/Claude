<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060708">
<title>Diario de Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Sala de proyección: negro de cine, luz ámbar de tungsteno, sombra verde azulada. Una columna de 480px, carruseles horizontales, navegación inferior. */
  --bg:#060708;
  --s1:#0e1013;
  --s2:#171b20;
  --line:rgba(237,231,219,.09);
  --text:#ede7db;
  --mute:#8f897d;
  --amber:#f2a541;
  --teal:#58b9b4;
  --danger:#e2584b;
  --f-display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --f-body:'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(90% 55% at 10% -5%, rgba(242,165,65,.18), transparent 60%),
  radial-gradient(80% 50% at 110% 105%, rgba(88,185,180,.14), transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.6))}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:61;pointer-events:none;opacity:.05;mix-blend-mode:overlay}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(100px + env(safe-area-inset-bottom))}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1}
.up{color:var(--amber)}.down{color:var(--teal)}.bad{color:var(--danger)}

.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;gap:10px}
.logo b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.12em}
.logo b i{font-style:normal;color:var(--amber)}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mute);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:4px;font-family:var(--f-display);font-size:18px;letter-spacing:.1em;text-transform:uppercase;transition:transform .12s ease, background .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:#140d03;box-shadow:0 10px 30px -10px rgba(242,165,65,.6)}
.btn.ghost{border:1px solid var(--line);background:rgba(255,255,255,.02)}
.btn.danger{border:1px solid rgba(226,88,75,.4);color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;font-size:14px;padding:0 14px}

.section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px}
.sec-h h2{font-size:22px}

/* Carrusel genérico */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.car.peek>*{flex-basis:88%}
.car-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s2);border:1px solid var(--line)}
.dot.on{background:var(--text)}
.dot.ok{background:var(--amber);border-color:var(--amber)}
.arrows{display:flex;gap:6px}
.arw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.arw svg,.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Escena (tarjeta de día) */
.scene{position:relative;overflow:hidden;border-radius:6px;padding:28px 18px 22px;background:
  linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.55)),
  radial-gradient(70% 90% at 85% 10%, rgba(242,165,65,.33), transparent 60%),
  radial-gradient(60% 80% at 0% 100%, rgba(88,185,180,.22), transparent 60%),#0b0c0e;
  border:1px solid var(--line);display:flex;flex-direction:column}
.scene::before,.scene::after{content:"";position:absolute;left:0;right:0;height:11px;background:#000}
.scene::before{top:0}.scene::after{bottom:0}
.scene .big{position:absolute;right:-4px;bottom:-16px;font-family:var(--f-display);font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(237,231,219,.13);pointer-events:none}
.scene .flare{position:absolute;left:-20%;right:-20%;top:36%;height:2px;background:linear-gradient(90deg,transparent,rgba(150,220,255,.5) 50%,transparent);filter:blur(1px);animation:flare 7s ease-in-out infinite;pointer-events:none}
.scene h1{font-size:40px;margin:8px 0 4px;position:relative}
.scene .sub{color:var(--amber);font-family:var(--f-display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;position:relative}
.scene ul{position:relative;list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:3px;font-size:14px;color:#c8c1b3;flex:1}
.scene ul li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene ul li span{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin-right:8px}
.scene.run{background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.55)),radial-gradient(70% 90% at 85% 10%, rgba(88,185,180,.35), transparent 60%),#0b0c0e}
.scene.run .sub{color:var(--teal)}
.rec{display:inline-flex;align-items:center;gap:6px;color:var(--danger)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--danger);animation:blink 1.2s steps(2) infinite}

/* Semana en inicio */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wslot{border:1px solid var(--line);border-radius:4px;padding:9px 4px;background:var(--s1);text-align:center;min-width:0}
.wslot b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--mute)}
.wslot span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wslot.done{border-color:rgba(242,165,65,.5);background:linear-gradient(180deg,rgba(242,165,65,.14),transparent)}
.wslot.done b{color:var(--amber)}
.wslot.runs.done{border-color:rgba(88,185,180,.5);background:linear-gradient(180deg,rgba(88,185,180,.14),transparent)}
.wslot.runs.done b{color:var(--teal)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:4px;padding:13px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--f-body);font-size:14px;color:var(--mute);margin-left:4px}
.tile .d{font-size:12.5px;margin-top:5px;color:var(--mute);display:grid;gap:1px}
.advice{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(242,165,65,.10),transparent 70%);border:1px solid rgba(242,165,65,.25);border-radius:6px;padding:14px;width:100%;text-align:left}
.advice b{font-family:var(--f-display);font-weight:400;letter-spacing:.08em;color:var(--amber);font-size:15px;flex:none;padding-top:1px}
.advice p{margin:0;font-size:15px}
.empty{border:1px dashed var(--line);border-radius:4px;padding:18px;color:var(--mute);font-size:14px}

/* Chips y segmentos */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:13px;color:var(--mute);background:var(--s1);white-space:nowrap}
.chipb.on{border-color:var(--amber);color:#140d03;background:var(--amber);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{padding:6px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.seg button.on{background:var(--s2);color:var(--amber)}

/* Informe */
.exr{background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:8px}
.exr-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exr-h b{font-weight:700;display:block}
.exr-h .best{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.badge{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid currentColor}
.cmp{display:grid;grid-template-columns:1fr 1fr 90px;gap:8px;margin-top:10px;align-items:end}
.cmp div{font-size:13px}
.cmp .mono{display:block;font-size:9px;margin-bottom:2px}
.spark{width:90px;height:30px}
.next{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:#cfc8ba}
.next b{color:var(--amber);font-family:var(--f-mono);font-weight:600}

/* Gráfica */
.chart{background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:9px;fill:var(--mute)}
.chart .lbl{fill:var(--text);font-size:11px;font-weight:600}
.chart-empty{background:var(--s1);border:1px dashed var(--line);border-radius:6px;padding:26px 16px;text-align:center;color:var(--mute);font-size:14px}

/* Steppers */
.stp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:8px}
.sb{height:64px;border-radius:6px;background:var(--s2);border:1px solid var(--line);font-family:var(--f-display);font-size:30px;line-height:1;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sb:active{background:rgba(242,165,65,.2);border-color:var(--amber)}
.sv{display:flex;flex-direction:column;align-items:center;min-width:0}
.sv input{width:100%;min-width:0;background:none;border:0;text-align:center;font-family:var(--f-display);font-size:46px;line-height:1.05;color:var(--text);padding:0;font-variant-numeric:tabular-nums}
.sv input:focus{outline:none;color:var(--amber)}
.sv span{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.stp.small{grid-template-columns:44px 1fr 44px;gap:4px;padding:6px}
.stp.small .sb{height:52px;font-size:24px}
.stp.small .sv input{font-size:30px}

/* Formularios */
.form{display:grid;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.in{width:100%;min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:4px;height:48px;padding:0 12px;font-family:var(--f-mono);font-size:17px;color:var(--text)}
.in:focus{border-color:var(--amber);outline:none}
.pace{display:flex;align-items:baseline;justify-content:center;gap:16px;padding:6px 0}
.pace b{font-family:var(--f-display);font-weight:400;font-size:44px;color:var(--teal);font-variant-numeric:tabular-nums}
.pace span{font-family:var(--f-mono);font-size:12px;color:var(--mute)}

.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0;width:100%;text-align:left}
.row .n{font-family:var(--f-display);font-size:22px;color:var(--amber);width:34px;flex:none}
.row .n.t{color:var(--teal)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--mute)}
.row .r{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--mute);flex:none}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--mute);flex:none;font-size:14px}
details.sess{background:var(--s1);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
details.sess summary{list-style:none;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
details.sess summary .row{border:0;background:none}
.sess-b{padding:0 14px 12px;font-size:13px;color:#c8c1b3}
.sess-b div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.sess-b div span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--mute);text-align:right}

/* Peso */
.wk{background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:14px}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wk-h b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.d7{border-radius:4px;background:var(--s2);padding:6px 2px;text-align:center;min-width:0}
.d7 span{display:block;font-family:var(--f-mono);font-size:9px;color:var(--mute)}
.d7 b{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;margin-top:2px;white-space:nowrap}
.d7.has{border:1px solid rgba(242,165,65,.35)}
.d7.no b{color:#4a4741}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(6,7,8,0),rgba(6,7,8,.92) 30%);padding:18px 0 calc(8px + env(safe-area-inset-bottom))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(14,16,19,.9);backdrop-filter:blur(10px)}
.nav a{display:grid;justify-items:center;gap:3px;padding:10px 0 8px;color:var(--mute);text-decoration:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;position:relative}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--amber)}
.nav a.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--amber)}
.live{display:flex;align-items:center;gap:12px;background:rgba(226,88,75,.08);border:1px solid rgba(226,88,75,.3);border-radius:4px;padding:10px 12px;margin-bottom:12px;width:100%;text-align:left}
.live .t{flex:1}

/* Entreno */
#workout{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg)}
#workout::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 40% at 50% 0%, rgba(242,165,65,.14), transparent 70%),var(--bg)}
.wk-wrap{max-width:480px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.slate{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(6,7,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.slate .tc{flex:1;display:flex;flex-direction:column;align-items:center}
.slate .tc b{font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px}
.prog{height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin:14px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd28a);transition:width .4s ease}
.slide{padding-top:16px;display:grid;gap:12px;align-content:start}
.slide h2{font-size:32px}
.slide .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:11px;padding:5px 9px;border-radius:99px;background:var(--s2);color:var(--mute);white-space:nowrap}
.pill.go{background:rgba(242,165,65,.15);color:var(--amber)}
.cue{font-size:14px;color:#bdb6a8;margin:0}
.setchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.sc{font-family:var(--f-mono);font-size:13px;padding:7px 10px;border-radius:4px;background:rgba(242,165,65,.12);border:1px solid rgba(242,165,65,.35);color:var(--text)}
.sc i{font-style:normal;color:var(--amber);margin-right:6px}
.sc.todo{background:none;border-style:dashed;border-color:var(--line);color:#5a564f}
.last{font-size:13px;color:var(--mute)}
.last b{color:var(--text);font-weight:500;font-family:var(--f-mono);font-size:12px}
.wk-end{display:grid;gap:8px;margin-top:26px}
.pill.swap{border:1px solid rgba(88,185,180,.45);background:rgba(88,185,180,.1);color:var(--teal);cursor:pointer}
.warm{border:1px solid rgba(242,165,65,.28);border-radius:8px;background:linear-gradient(120deg,rgba(242,165,65,.07),transparent 70%)}
.warm-h{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;gap:8px}
.warm-l{display:grid;gap:6px;padding:0 10px 10px}
.wu{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:6px;background:var(--s2);border:1px solid var(--line);font-family:var(--f-mono);font-size:14px}
.wu i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:11px;color:var(--mute);flex:none}
.wu.on{color:var(--mute);text-decoration:line-through}
.wu.on i{background:var(--amber);border-color:var(--amber);color:#140d03;text-decoration:none}

.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:10px;background:rgba(14,16,19,.96);border:1px solid rgba(242,165,65,.35);border-radius:99px;padding:6px 8px 6px 6px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8);backdrop-filter:blur(10px)}
.rest[hidden]{display:none}
.rest svg.ring{width:46px;height:46px;transform:rotate(-90deg)}
.rest .tt{font-family:var(--f-mono);font-size:20px;font-weight:600;min-width:58px;font-variant-numeric:tabular-nums}
.rest .tl{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:block}
.rest button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-family:var(--f-mono);font-size:11px}

.endcard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0;text-align:center;animation:rise .8s ease both}
.endcard .fin{font-family:var(--f-display);font-size:120px;line-height:.9;letter-spacing:.08em;background:linear-gradient(180deg,#fff2d9,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.endcard .tiles{margin:26px 0 12px;text-align:left}
.pr{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(242,165,65,.08);border:1px solid rgba(242,165,65,.3);border-radius:4px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.pr b{font-family:var(--f-display);font-weight:400;color:var(--amber);letter-spacing:.06em}

.sc.pr{background:linear-gradient(135deg,#ffd98f,var(--amber));color:#140d03;border-color:var(--amber);font-weight:600}
.sc.pr i{color:#140d03}
.sc.pr::after{content:" ★"}
.vitrina{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trophy{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:13px;min-width:0;display:flex;flex-direction:column;gap:6px}
.trophy::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.5}
.trophy.fresh{border-color:rgba(242,165,65,.5);background:linear-gradient(160deg,rgba(242,165,65,.14),var(--s1) 60%)}
.tr-h{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.tr-h b{font-weight:600;font-size:14px;line-height:1.25}
.tr-h .badge{font-size:8px;padding:3px 6px}
.tr-v{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.tr-v small{font-family:var(--f-mono);font-size:11px;color:var(--mute);margin-left:4px}
.tr-d{display:grid;gap:1px;font-size:12px;color:var(--mute)}
#prflash{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 50%,rgba(242,165,65,.35),rgba(0,0,0,.85));cursor:pointer;text-align:center;padding:24px}
#prflash[hidden]{display:none}
#prflash.go{animation:prIn 2.4s ease both}
.prf-in{display:grid;gap:10px;justify-items:center}
.prf-t{font-family:var(--f-display);font-size:96px;line-height:1.15;padding-top:.08em;letter-spacing:.1em;background:linear-gradient(180deg,#fff4dc,var(--amber) 70%,#b86f12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(242,165,65,.5))}
#prflash.go .prf-t{animation:prT 2.4s cubic-bezier(.2,.9,.3,1) both}
.prf-v{font-family:var(--f-mono);font-size:26px;font-weight:600}
@keyframes prIn{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes prT{0%{transform:scale(1.4);letter-spacing:.4em;opacity:0}15%{transform:scale(1);letter-spacing:.1em;opacity:1}100%{transform:scale(.98)}}
#dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#dlg[hidden]{display:none}
.dlg-card{width:100%;max-width:448px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:22px 18px 16px;animation:rise .25s ease both}
.dlg-card h3{font-size:26px}
.dlg-card p{color:#c8c1b3;margin:10px 0 18px}
.dlg-btns{display:grid;gap:8px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:80;background:var(--text);color:#111;padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.15}}
@keyframes flare{0%,100%{transform:translateX(-12%);opacity:.5}50%{transform:translateX(12%);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}

<script>
/* ================= Rutina ================= */
const ROUTINE=[
 {id:'d1',n:'01',name:'Pecho + Espalda',sub:'Horizontal',wd:'Lunes',items:[['bench',4,6,8],['bbrow',4,6,8],['incdb',3,8,10],['latpd',3,8,12],['cfly',3,12,15],['clat',3,12,15]]},
 {id:'d2',n:'02',name:'Pierna + Abdomen',sub:'Base',wd:'Martes',items:[['squat',4,6,8],['rdl',3,8,10],['legpress',3,10,12],['legcurl',3,10,12],['calf',3,10,15],['hlr',3,10,15]]},
 {id:'d3',n:'03',name:'Hombros + Brazos',sub:'Detalle',wd:'Jueves',items:[['ohp',4,6,8],['dblat',4,12,15],['facepull',3,15,15],['inccurl',3,8,12],['ohtri',3,10,12],['hammer',3,10,12]]},
 {id:'d4',n:'04',name:'Pecho + Espalda',sub:'Vertical',wd:'Viernes',items:[['pullup',4,6,10],['incbb',4,6,8],['dbrow',3,8,12],['dips',3,8,12],['pullover',3,12,15],['clat',3,15,15]]}
];
const DAY=Object.fromEntries(ROUTINE.map(d=>[d.id,d]));
const EX={
 bench:{n:'Press banca con barra',m:'Pecho',r:'torso',k:'c',rest:180,cue:'Escápulas juntas y abajo. Toca el pecho y empuja sin rebotar.',bar:true},
 bbrow:{n:'Remo con barra',m:'Espalda',r:'torso',k:'c',rest:150,cue:'Torso a unos 45°. Lleva la barra al ombligo.',bar:true},
 incdb:{n:'Press inclinado con mancuernas',m:'Pecho superior',r:'torso',k:'c',rest:120,cue:'Banco a 30°. Baja hasta notar el estiramiento.'},
 latpd:{n:'Jalón al pecho neutro',m:'Dorsal',r:'torso',k:'c',rest:90,cue:'Tira con los codos hacia las costillas.'},
 cfly:{n:'Aperturas en polea',m:'Pecho',r:'torso',k:'i',rest:75,cue:'Codos algo flexionados. Abre hasta estirar bien.'},
 clat:{n:'Laterales en polea',m:'Hombro lateral',r:'torso',k:'i',rest:60,cue:'Sube hasta la altura del hombro, baja controlando.'},
 squat:{n:'Sentadilla con barra',m:'Cuádriceps · glúteo',r:'pierna',k:'c',rest:180,cue:'Baja al menos a paralelo. Rodillas en la línea de los pies.',bar:true},
 rdl:{n:'Peso muerto rumano',m:'Isquios · glúteo',r:'pierna',k:'c',rest:150,cue:'Cadera atrás, espalda recta, hasta notar los isquios.',bar:true},
 legpress:{n:'Prensa',m:'Cuádriceps',r:'pierna',k:'c',rest:120,cue:'Recorrido completo sin despegar la zona lumbar.'},
 legcurl:{n:'Curl femoral sentado',m:'Isquios',r:'pierna',k:'i',rest:90,cue:'Controla la bajada.'},
 calf:{n:'Gemelos de pie',m:'Gemelo',r:'pierna',k:'i',rest:60,cue:'Pausa de 1 segundo abajo, estirado.'},
 hlr:{n:'Elevación de piernas colgado',m:'Abdomen',r:'pierna',k:'i',rest:60,cue:'Sube la pelvis, no solo las piernas.',nokg:true},
 ohp:{n:'Press militar de pie',m:'Hombro',r:'torso',k:'c',rest:180,cue:'Glúteos y abdomen apretados. Barra en línea recta.',bar:true},
 dblat:{n:'Laterales con mancuernas',m:'Hombro lateral',r:'torso',k:'i',rest:60,cue:'Algo inclinado hacia delante, sin balanceo.'},
 facepull:{n:'Face pull',m:'Hombro posterior',r:'torso',k:'i',rest:60,cue:'Tira hacia la frente abriendo los codos.'},
 inccurl:{n:'Curl inclinado',m:'Bíceps',r:'torso',k:'i',rest:75,cue:'Brazos por detrás del cuerpo para estirar el bíceps.'},
 ohtri:{n:'Tríceps sobre la cabeza',m:'Tríceps',r:'torso',k:'i',rest:75,cue:'En polea. Estira por completo detrás de la cabeza.'},
 hammer:{n:'Curl martillo',m:'Braquial · antebrazo',r:'torso',k:'i',rest:60,cue:'Codos pegados al cuerpo.'},
 pullup:{n:'Dominadas',m:'Dorsal',r:'torso',k:'c',rest:150,cue:'De brazos estirados a barbilla sobre la barra. Kg = lastre.',bw:true},
 incbb:{n:'Press inclinado con barra',m:'Pecho superior',r:'torso',k:'c',rest:180,cue:'Baja controlado a la parte alta del pecho.',bar:true},
 dbrow:{n:'Remo con mancuerna',m:'Dorsal',r:'torso',k:'c',rest:90,cue:'Estira abajo y lleva el codo hacia la cadera.'},
 dips:{n:'Fondos en paralelas',m:'Pecho · tríceps',r:'torso',k:'c',rest:120,cue:'Torso algo inclinado hacia delante. Kg = lastre.',bw:true},
 pullover:{n:'Pullover en polea',m:'Dorsal',r:'torso',k:'i',rest:60,cue:'Brazos casi rectos. Aísla el dorsal.'}
};
/* Alternativas equivalentes (mismo músculo y patrón) para cuando la máquina está ocupada */
Object.assign(EX,{
 dbbench:{n:'Press banca con mancuernas',m:'Pecho',r:'torso',k:'c',rest:150,cue:'Baja las mancuernas hasta los lados del pecho.'},
 smithbench:{n:'Press banca en multipower',m:'Pecho',r:'torso',k:'c',rest:150,cue:'Barra al pecho medio. Escápulas atrás.'},
 machpress:{n:'Press de pecho en máquina',m:'Pecho',r:'torso',k:'c',rest:120,cue:'Asas a la altura del pecho medio.'},
 cablerow:{n:'Remo en polea baja',m:'Espalda',r:'torso',k:'c',rest:120,cue:'Estira hacia delante y lleva los codos atrás.'},
 tbar:{n:'Remo en T',m:'Espalda',r:'torso',k:'c',rest:150,cue:'Pecho fuera, tira hacia el abdomen.'},
 chestrow:{n:'Remo con apoyo en pecho',m:'Espalda',r:'torso',k:'c',rest:120,cue:'Pecho pegado al apoyo, sin impulso.'},
 incsmith:{n:'Press inclinado en multipower',m:'Pecho superior',r:'torso',k:'c',rest:150,cue:'Banco a 30°. Barra a la parte alta del pecho.'},
 incmach:{n:'Press inclinado en máquina',m:'Pecho superior',r:'torso',k:'c',rest:120,cue:'Controla la bajada hasta notar el estiramiento.'},
 latwide:{n:'Jalón agarre ancho',m:'Dorsal',r:'torso',k:'c',rest:90,cue:'Lleva la barra a la parte alta del pecho.'},
 lat1:{n:'Jalón a una mano',m:'Dorsal',r:'torso',k:'i',rest:60,cue:'Estira arriba y lleva el codo a la cadera.'},
 dbfly:{n:'Aperturas con mancuernas',m:'Pecho',r:'torso',k:'i',rest:75,cue:'Codos algo flexionados, baja hasta estirar.'},
 pecdeck:{n:'Contractora (pec deck)',m:'Pecho',r:'torso',k:'i',rest:75,cue:'Abre hasta estirar y junta sin chocar.'},
 machlat:{n:'Laterales en máquina',m:'Hombro lateral',r:'torso',k:'i',rest:60,cue:'Sube con los codos, no con las manos.'},
 hack:{n:'Sentadilla hack',m:'Cuádriceps',r:'pierna',k:'c',rest:150,cue:'Baja profundo con la espalda apoyada.'},
 smithsq:{n:'Sentadilla en multipower',m:'Cuádriceps · glúteo',r:'pierna',k:'c',rest:150,cue:'Pies algo adelantados, baja a paralelo.'},
 dbrdl:{n:'Rumano con mancuernas',m:'Isquios · glúteo',r:'pierna',k:'c',rest:120,cue:'Cadera atrás, mancuernas pegadas a las piernas.'},
 lyingcurl:{n:'Curl femoral tumbado',m:'Isquios',r:'pierna',k:'i',rest:90,cue:'Cadera pegada al banco. Controla la bajada.'},
 bulg:{n:'Zancadas búlgaras',m:'Cuádriceps · glúteo',r:'pierna',k:'c',rest:90,cue:'Pie trasero en el banco. Kg = cada mancuerna.'},
 legext:{n:'Extensión de cuádriceps',m:'Cuádriceps',r:'pierna',k:'i',rest:75,cue:'Pausa arriba, baja en 3 segundos.'},
 seatcalf:{n:'Gemelos sentado',m:'Gemelo',r:'pierna',k:'i',rest:60,cue:'Pausa abajo, estirado.'},
 presscalf:{n:'Gemelos en prensa',m:'Gemelo',r:'pierna',k:'i',rest:60,cue:'Solo la punta de los pies, recorrido completo.'},
 cablecrunch:{n:'Crunch en polea',m:'Abdomen',r:'pierna',k:'i',rest:60,cue:'Enrolla la columna, no tires con los brazos.'},
 abwheel:{n:'Rueda abdominal',m:'Abdomen',r:'pierna',k:'i',rest:60,cue:'Abdomen apretado, sin hundir la zona lumbar.',nokg:true},
 dbohp:{n:'Press militar con mancuernas',m:'Hombro',r:'torso',k:'c',rest:150,cue:'Sentado, baja hasta la altura de las orejas.'},
 machohp:{n:'Press de hombro en máquina',m:'Hombro',r:'torso',k:'c',rest:120,cue:'Espalda apoyada, sin bloquear arriba.'},
 revfly:{n:'Pájaros con mancuernas',m:'Hombro posterior',r:'torso',k:'i',rest:60,cue:'Inclinado, abre con los codos algo flexionados.'},
 revpec:{n:'Contractora inversa',m:'Hombro posterior',r:'torso',k:'i',rest:60,cue:'Abre hacia atrás sin juntar las escápulas.'},
 bbcurl:{n:'Curl con barra',m:'Bíceps',r:'torso',k:'i',rest:75,cue:'Codos quietos, sin balanceo.'},
 cablecurl:{n:'Curl en polea',m:'Bíceps',r:'torso',k:'i',rest:60,cue:'Da un paso atrás para estirar el bíceps abajo.'},
 preacher:{n:'Curl predicador',m:'Bíceps',r:'torso',k:'i',rest:75,cue:'Baja hasta casi estirar el brazo.'},
 skull:{n:'Press francés',m:'Tríceps',r:'torso',k:'i',rest:75,cue:'Barra detrás de la cabeza, codos quietos.'},
 pushdown:{n:'Extensión en polea alta',m:'Tríceps',r:'torso',k:'i',rest:60,cue:'Codos pegados, estira por completo.'},
 ropehammer:{n:'Martillo en polea con cuerda',m:'Braquial · antebrazo',r:'torso',k:'i',rest:60,cue:'Codos pegados, agarre neutro.'},
 machdip:{n:'Fondos en máquina',m:'Pecho · tríceps',r:'torso',k:'c',rest:120,cue:'Baja hasta 90° de codo.'},
 closebench:{n:'Press banca agarre cerrado',m:'Tríceps · pecho',r:'torso',k:'c',rest:150,cue:'Manos al ancho de hombros, codos pegados.',bar:true},
 dbpullover:{n:'Pullover con mancuerna',m:'Dorsal · pecho',r:'torso',k:'i',rest:60,cue:'Brazos casi rectos, baja hasta estirar.'}
});
const ALT={bench:['dbbench','smithbench','machpress'],bbrow:['cablerow','tbar','chestrow'],incdb:['incbb','incsmith','incmach'],latpd:['latwide','lat1','pullup'],cfly:['dbfly','pecdeck'],clat:['dblat','machlat'],
 squat:['hack','smithsq','legpress'],rdl:['dbrdl','lyingcurl'],legpress:['hack','bulg','legext'],legcurl:['lyingcurl','dbrdl'],calf:['seatcalf','presscalf'],hlr:['cablecrunch','abwheel'],
 ohp:['dbohp','machohp'],dblat:['clat','machlat'],facepull:['revfly','revpec'],inccurl:['bbcurl','cablecurl','preacher'],ohtri:['skull','pushdown'],hammer:['ropehammer','bbcurl'],
 pullup:['latpd','latwide'],incbb:['incdb','incsmith','incmach'],dbrow:['cablerow','chestrow','bbrow'],dips:['machdip','closebench'],pullover:['dbpullover','lat1']};
const TARGET={};ROUTINE.forEach(d=>d.items.forEach(([id,s,a,b])=>{if(!TARGET[id])TARGET[id]={sets:s,min:a,max:b}}));
Object.entries(ALT).forEach(([p,l])=>l.forEach(x=>{if(!TARGET[x])TARGET[x]=TARGET[p]}));
const ALLEX=Object.keys(TARGET);
/* Calentamiento: series de aproximación según el peso de trabajo */
function warmup(id,W){
  const d=EX[id];if(!d||d.k!=='c'||d.nokg)return[];const r=v=>Math.round(v/2.5)*2.5;const out=[];
  if(d.bw){out.push('Peso corporal × 5');if(W>=5)out.push(fkg(r(W*.5))+' kg de lastre × 3');return out}
  if(!(W>0))return[];
  if(d.bar){out.push('Barra (20 kg) × 10');let prev=20;[[.5,5],[.7,3],[.85,1]].forEach(([p,n])=>{const kg=r(W*p);if(kg>prev&&kg<W){out.push(fkg(kg)+' kg × '+n);prev=kg}});return out}
  let prev=0;[[.5,8],[.75,4]].forEach(([p,n])=>{const kg=r(W*p);if(kg>prev&&kg<W){out.push(fkg(kg)+' kg × '+n);prev=kg}});return out;
}

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const wkKey=s=>dstr(monday(pdate(s)));
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['L','M','X','J','V','S','D'];
const fdate=s=>{const d=typeof s==='string'?pdate(s):new Date(s);return d.getDate()+' '+MES[d.getMonth()]};
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))};
const fkg=v=>(Math.round(v*10)/10).toLocaleString('es-ES',{maximumFractionDigits:1});
const fkm=v=>(Math.round(v*100)/100).toLocaleString('es-ES',{maximumFractionDigits:2});
const e1rm=(kg,r)=>r>0?kg*(1+r/30):0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600);return h?h+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60):mmss(s)};
const fvol=v=>v>=1000?fkg(v/1000)+' t':Math.round(v)+' kg';
const range=(a,b)=>a===b?String(a):a+'-'+b;
const pct=(a,b)=>(a==null||b==null||!b)?null:(a-b)/b*100;
/* En la semana en curso, un 0 todavía no es una bajada: no se compara hasta que haya algo. */
const pctW=(a,b,cur)=>(cur&&!a)?null:pct(a,b);

/* ================= Datos en el móvil ================= */
const KEY='hierro.v1';
let S={sessions:[],body:[],runs:[],draft:null};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){S.sessions=j.sessions||[];S.body=j.body||[];S.runs=j.runs||[];S.draft=j.draft||null}}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en el móvil')}}
let pt;function persistSoon(){clearTimeout(pt);pt=setTimeout(persist,400)}

const sorted=()=>S.sessions.slice().sort((a,b)=>a.startedAt-b.startedAt);
function sessVol(s){let v=0,n=0;for(const e of s.ex)for(const st of e.sets){v+=(st.kg||0)*(st.reps||0);n++}return{v,n}}
function history(id){const out=[];for(const s of sorted())for(const e of s.ex)if(e.id===id&&e.sets.length)out.push({s,sets:e.sets});return out}
function bodyNow(){const b=S.body.slice().sort((x,y)=>x.d<y.d?-1:1);return b.length?b[b.length-1].kg:75}
/* Puntuación de una serie: 1RM estimado. En dominadas y fondos cuenta tu peso + lastre. */
function score(id,s){const d=EX[id];if(d.nokg)return s.reps;if(d.bw)return e1rm(bodyNow()+(s.kg||0),s.reps);return e1rm(s.kg||0,s.reps)}
function setTxt(id,s){return EX[id].nokg?s.reps+' reps':(EX[id].bw&&!s.kg?'PC':fkg(s.kg))+'×'+s.reps}
function stepKg(id){return EX[id].k==='i'?1:2.5}
function incFor(id){const d=EX[id];if(d.nokg)return 0;if(d.k==='i')return 1;return d.r==='pierna'?5:2.5}
/* Récords: mejor serie de siempre por ejercicio (por 1RM estimado; reps en ejercicios sin peso) */
function bestEver(id){let b=null,first=null;for(const s of sorted())for(const e of s.ex)if(e.id===id)for(const st of e.sets){const v=score(id,st);if(!first)first={v,date:s.date};if(!b||v>b.v)b={v,st,date:s.date}}return b?{...b,first}:null}
function records(){const ids=new Set();S.sessions.forEach(s=>s.ex.forEach(e=>{if(e.sets.length)ids.add(e.id)}));return[...ids].sort((a,b)=>ALLEX.indexOf(a)-ALLEX.indexOf(b)).map(id=>({id,b:bestEver(id)})).filter(x=>x.b)}
function nextDay(){const l=sorted().pop();if(!l)return ROUTINE[0];const i=ROUTINE.findIndex(d=>d.id===l.day);return ROUTINE[(i+1)%4]}
function suggest(id,tg){
  const t=tg||TARGET[id],h=history(id),d=EX[id];
  if(!h.length)return{kg:d.bw?0:null,reps:t.min,note:'Primera vez',up:false,last:null};
  const last=h[h.length-1],sets=last.sets;
  const topKg=Math.max(...sets.map(s=>s.kg||0));
  const allTop=sets.length>=t.sets&&sets.every(s=>s.reps>=t.max);
  if(d.nokg)return{kg:0,reps:allTop?t.max+1:Math.max(t.min,sets[0].reps),note:allTop?'Añade 1-2 reps':'Busca +1 rep',up:allTop,last};
  if(allTop){const inc=incFor(id);return{kg:Math.round((topKg+inc)*10)/10,reps:t.min,note:`Sube +${fkg(inc)} kg`,up:true,last}}
  return{kg:topKg,reps:Math.min(t.max,Math.max(t.min,(sets[0].reps||t.min))),note:'Mismo peso, +reps',up:false,last};
}

/* ================= Semanas y comparativas ================= */
function weekKeys(){const s=new Set([wkKey(today())]);S.sessions.forEach(x=>s.add(wkKey(x.date)));S.runs.forEach(x=>s.add(wkKey(x.date)));return[...s].sort().reverse()}
function wkStats(k){
  const ss=S.sessions.filter(x=>wkKey(x.date)===k),rs=S.runs.filter(x=>wkKey(x.date)===k);
  let vol=0,sets=0;ss.forEach(s=>{const v=sessVol(s);vol+=v.v;sets+=v.n});
  const km=rs.reduce((a,r)=>a+r.km,0),sec=rs.reduce((a,r)=>a+r.sec,0);
  const bws=S.body.filter(b=>wkKey(b.d)===k);const bw=bws.length?bws.reduce((a,b)=>a+b.kg,0)/bws.length:null;
  const has=ss.length+rs.length+bws.length>0;
  return{ss,rs,vol,sets,km,sec,pace:km?sec/km:null,bw,n:ss.length+rs.length,days:new Set(ss.map(s=>s.day)),has};
}
function exBest(id,k){let b=null;for(const s of S.sessions)if(wkKey(s.date)===k)for(const e of s.ex)if(e.id===id)for(const st of e.sets){const v=score(id,st);if(!b||v>b.v)b={v,st}}return b}
function exBestBefore(id,k){let b=null;for(const s of S.sessions)if(wkKey(s.date)<k)for(const e of s.ex)if(e.id===id)for(const st of e.sets){const v=score(id,st);if(!b||v>b.v)b={v,st}}return b}
function cmpHtml(p,inverse){if(p==null||isNaN(p))return'<span class="mono">—</span>';if(Math.abs(p)<1)return'<span>= igual</span>';const good=inverse?p<0:p>0;return`<span class="${good?'up':'bad'}">${p>0?'▲ +':'▼ '}${Math.round(p)}%</span>`}
function deltaHtml(d,unit=' kg'){if(d==null||isNaN(d))return'<span class="mono">—</span>';if(Math.abs(d)<0.05)return'<span>= 0'+unit+'</span>';return d>0?`<span class="up">▲ +${fkg(d)}${unit}</span>`:`<span class="down">▼ ${fkg(d)}${unit}</span>`}
function exAdvice(id,k){
  const cur=exBest(id,k);if(!cur)return null;
  const pw=exBest(id,addDays(k,-7))||exBestBefore(id,k), pm=exBest(id,addDays(k,-28));
  const pP=pw?pct(cur.v,pw.v):null, pM=pm?pct(cur.v,pm.v):null;
  const t=TARGET[id]||{sets:3,min:8,max:12},sg=suggest(id,t),d=EX[id];
  const nextTxt=d.nokg?`${t.sets} × ${sg.reps}+ reps`:`${d.bw&&!sg.kg?'peso corporal':fkg(sg.kg)+' kg'} × ${range(t.min,t.max)}`;
  let st,cls,tip;
  if(pP==null){st='Nuevo';cls='mono';tip='Primera semana registrada. Repite el peso y suma reps hasta llegar a '+t.max+' en todas las series.'}
  else if(pP>=1){st='Mejora';cls='up';tip=sg.up?'Vas bien y ya completas el rango: sube el peso y vuelve a '+t.min+' reps.':'Vas bien. Mantén el peso hasta hacer '+t.sets+'×'+t.max+'; entonces sube.'}
  else if(pP>-1){if(pM!=null&&pM<2){st='Estancado';cls='bad';tip='Un mes sin avanzar: haz una semana de descarga (mitad de series) o añade una serie.'}else{st='Igual';cls='mono';tip='Igual que la semana pasada: mismo peso y busca +1 rep por serie.'}}
  else{st='Baja';cls='bad';tip='Has rendido menos: repite el peso de la semana pasada y cuida sueño y proteína.'}
  return{cur,pP,pM,st,cls,tip,nextTxt};
}
function sparkWeeks(id,k){const pts=[];for(let i=7;i>=0;i--){const b=exBest(id,addDays(k,-7*i));if(b)pts.push({i:7-i,v:b.v})}
  if(pts.length<2)return'<svg class="spark"></svg>';const mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));const y=v=>26-(mx===mn?.5:(v-mn)/(mx-mn))*22;const x=i=>4+i*(82/7);
  const d=pts.map((p,j)=>(j?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');const l=pts[pts.length-1];
  return`<svg class="spark" viewBox="0 0 90 30" aria-hidden="true"><path d="${d}" fill="none" stroke="#f2a541" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(l.i).toFixed(1)}" cy="${y(l.v).toFixed(1)}" r="2.6" fill="#f2a541"/></svg>`}
function weekVerdict(k){
  const w=wkStats(k),p=wkStats(addDays(k,-7));const gym=w.ss.length,runs=w.rs.length;const isCur=k===wkKey(today());
  const missing=ROUTINE.filter(d=>!w.days.has(d.id));
  if(!w.n)return isCur?`Semana nueva. Toca ${nextDay().name} (${nextDay().sub}).`:'Semana sin entrenos registrados.';
  let t='';
  if(gym>=4)t='Semana completa de gimnasio. ';
  else if(isCur)t=`Llevas ${gym}/4 de gimnasio. Te falta: ${missing.map(d=>d.name+' '+d.sub.toLowerCase()).join(', ')}. `;
  else t=`Hiciste ${gym}/4 de gimnasio. `;
  if(runs)t+=`${runs} carrera${runs>1?'s':''} (${fkm(w.km)} km). `;
  const vp=pct(w.vol,p.vol);if(vp!=null&&!isCur){t+=vp>=0?`Volumen +${Math.round(vp)}% respecto a la anterior.`:`Volumen ${Math.round(vp)}% respecto a la anterior.`}
  return t.trim();
}

/* ================= Gráfica ================= */
let gid=0;
function chart(series,o={}){
  const all=series.flatMap(s=>s.pts);
  if(all.length<2)return`<div class="chart-empty">${o.empty||'Hacen falta al menos dos registros.'}</div>`;
  const W=340,H=o.h||170,L=38,R=16,T=20,B=24;const id='g'+(++gid);
  let t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t));if(t1===t0){t0-=864e5;t1+=864e5}
  const y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
  const span=(y1-y0)||Math.max(1,Math.abs(y1)*.05);const raw=span/3;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const lo=Math.floor(y0/step)*step;let hi=Math.ceil(y1/step)*step;if(hi<=lo)hi=lo+step;
  const inv=!!o.invert;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R), y=v=>{const f=(v-lo)/(hi-lo);return T+(inv?f:1-f)*(H-T-B)};
  const f=o.fmt||(v=>fkg(v));
  let g='';for(let v=lo;v<=hi+step*1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(237,231,219,.07)"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${f(v)}</text>`}
  g+=`<text x="${L}" y="${H-6}">${fdate(t0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(t1)}</text>`;
  let body='';
  series.forEach((s,si)=>{const p=s.pts;if(!p.length)return;const col=s.color||'#f2a541';
    const d=p.map((q,i)=>(i?'L':'M')+x(q.t).toFixed(1)+' '+y(q.y).toFixed(1)).join(' ');
    if(s.area&&p.length>1)body+=`<path d="${d} L${x(p[p.length-1].t).toFixed(1)} ${H-B} L${x(p[0].t).toFixed(1)} ${H-B} Z" fill="url(#${id})"/>`;
    body+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    if(s.dots&&p.length<=40)body+=p.map(q=>`<circle cx="${x(q.t).toFixed(1)}" cy="${y(q.y).toFixed(1)}" r="2.2" fill="${col}"/>`).join('');
    if(si===0){const q=p[p.length-1];const cx=x(q.t),cy=y(q.y);body+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="${col}" opacity=".25"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.5" fill="${col}"/><text class="lbl" x="${Math.min(cx,W-R).toFixed(1)}" y="${Math.max(cy-10,12).toFixed(1)}" text-anchor="${cx>W-60?'end':'middle'}">${f(q.y)}${o.unit||''}</text>`}});
  const c=series[0].color||'#f2a541';
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfica')}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>${g}${body}</svg></div>`;
}

/* ================= Carruseles ================= */
const ARROW_L='<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>',ARROW_R='<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
function carNav(id,n,cls=[]){return`<div class="car-nav"><div class="dots" data-dots="${id}">${Array.from({length:n},(_,i)=>`<button class="dot ${cls[i]||''}" data-act="cargo" data-car="${id}" data-i="${i}" aria-label="Ir a ${i+1}"></button>`).join('')}</div><div class="arrows"><button class="arw" data-act="carstep" data-car="${id}" data-d="-1" aria-label="Anterior">${ARROW_L}</button><button class="arw" data-act="carstep" data-car="${id}" data-d="1" aria-label="Siguiente">${ARROW_R}</button></div></div>`}
function carIndex(el){const w=el.firstElementChild?el.firstElementChild.getBoundingClientRect().width+10:el.clientWidth;return Math.round(el.scrollLeft/w)}
function carGo(el,i,smooth=true){const kids=el.children;i=Math.max(0,Math.min(kids.length-1,i));const left=kids[i].offsetLeft-el.firstElementChild.offsetLeft;el.scrollTo({left,behavior:smooth?'smooth':'instant'})}
function wireCars(root){root.querySelectorAll('.car[data-car]').forEach(el=>{let t;const id=el.dataset.car;const upd=()=>{const i=carIndex(el);root.querySelectorAll(`[data-dots="${id}"] .dot`).forEach((d,j)=>d.classList.toggle('on',j===i));if(id==='wk'&&S.draft&&S.draft.idx!==i){S.draft.idx=i;persistSoon();const c=$('#exCount');if(c)c.textContent=pad(i+1)+' / '+pad(S.draft.ex.length)}};el.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(upd,90)},{passive:true});upd()})}
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const el=(!$('#workout').hidden?$('#workout'):document).querySelector('.car[data-car]');if(!el)return;carGo(el,carIndex(el)+(e.key==='ArrowRight'?1:-1))});

  if(k==='rkm'||k==='rmin'||k==='rsec'){const R=UI.run;if(k==='rkm')R.km=Math.max(0,Math.round((R.km+dir*0.1)*100)/100);if(k==='rmin')R.min=Math.max(0,R.min+dir);if(k==='rsec'){let t=R.min*60+R.sec+dir*5;t=Math.max(0,t);R.min=Math.floor(t/60);R.sec=t%60}
    syncRun();}
}
function syncRun(){const R=UI.run;const set=(k,v)=>{const i=document.querySelector(`[data-sf="${k}"]`);if(i&&document.activeElement!==i)i.value=v};set('rkm',R.km.toFixed(2).replace('.',','));set('rmin',R.min);set('rsec',R.sec);
  const t=R.min*60+R.sec;$('#paceOut')&&($('#paceOut').textContent=R.km>0&&t>0?mmss(t/R.km):'—');$('#speedOut')&&($('#speedOut').textContent=(R.km>0&&t>0?fkm(R.km/(t/3600)):'—')+' km/h')}
let holdT,holdI;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-step]');if(!b)return;e.preventDefault();doStep(b);try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}clearTimeout(holdT);clearInterval(holdI);holdT=setTimeout(()=>{holdI=setInterval(()=>doStep(b),85)},420)});
['pointerup','pointercancel','blur'].forEach(t=>window.addEventListener(t,()=>{clearTimeout(holdT);clearInterval(holdI)}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-step]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b&&e.detail===0)doStep(b)});
document.addEventListener('input',e=>{const i=e.target;const k=i.dataset&&i.dataset.sf;if(!k)return;const v=num(i.value);
  if((k==='kg'||k==='reps')&&S.draft&&!isNaN(v)){S.draft.ex[+i.dataset.e].cur[k]=Math.max(0,v);if(k==='kg')updateWarm(+i.dataset.e);persistSoon()}
  if(k==='rkm'&&!isNaN(v)){UI.run.km=Math.max(0,v);syncRun()}if(k==='rmin'&&!isNaN(v)){UI.run.min=Math.max(0,Math.floor(v));syncRun()}if(k==='rsec'&&!isNaN(v)){UI.run.sec=Math.min(59,Math.max(0,Math.floor(v)));syncRun()}});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.sf)setTimeout(()=>{try{e.target.select()}catch(x){}},0)});

/* ================= Diálogo y aviso ================= */
let dlgRes=null;
function dialog({title,text,buttons}){return new Promise(res=>{dlgRes=res;const d=$('#dlg');d.innerHTML=`<div class="dlg-card" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3><p>${esc(text)}</p><div class="dlg-btns">${buttons.map((b,i)=>`<button class="btn ${b.cls||'ghost'}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;d.hidden=false;d.onclick=e=>{const b=e.target.closest('[data-i]');if(b){d.hidden=true;res(buttons[+b.dataset.i].v)}else if(e.target===d){d.hidden=true;res(null)}};const f=d.querySelector('[data-i]');f&&f.focus()})}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ================= Eventos ================= */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const D=S.draft;
  if(a==='start')return startWorkout(b.dataset.d);
  if(a==='prclose'){$('#prflash').hidden=true;return}
  if(a==='resume')return openWorkout();
  if(a==='min'||a==='closeend')return closeWorkout();
  if(a==='finish')return finishWorkout();
  if(a==='go'){location.hash=b.dataset.v;return}
  if(a==='cargo'||a==='carstep'){const root=b.closest('#workout')||document;const el=root.querySelector(`.car[data-car="${b.dataset.car}"]`);if(!el)return;carGo(el,a==='cargo'?+b.dataset.i:carIndex(el)+(+b.dataset.d));return}
  if(a==='discard'){const r=await dialog({title:'¿Descartar sesión?',text:'Se perderán las series de esta sesión.',buttons:[{label:'Descartar',cls:'danger',v:1},{label:'Cancelar',v:0}]});if(r){S.draft=null;persist();closeWorkout()}return}
  if(a==='logset'&&D){const ei=+b.dataset.e,e=D.ex[ei],d=EX[e.id];const reps=Math.round(+e.cur.reps||0);
    if(reps<1){toast('Pon las repeticiones');return}
    const ns={kg:d.nokg?0:Math.round((+e.cur.kg||0)*10)/10,reps};
    const prev=bestEver(e.id);const inSess=e.sets.reduce((m,x)=>Math.max(m,score(e.id,x)),0);
    if(prev&&score(e.id,ns)>Math.max(prev.v,inSess)+1e-9){ns.pr=true;e.sets.forEach(x=>{delete x.pr});prFlash(e.id,ns,prev)}
    e.sets.push(ns);
    D.restTotal=d.rest;D.restEnd=Date.now()+d.rest*1000;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(x){}
    try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}
    const tgt=DAY[D.day].items[ei][1];persist();renderWorkout();
    if(e.sets.length===tgt&&ei<D.ex.length-1){setTimeout(()=>{const car=$('#workout .car');car&&carGo(car,ei+1)},650);toast('Ejercicio completado · siguiente')}
    return}
  if(a==='delset'&&D){const ei=+b.dataset.e,si=+b.dataset.s;const s=D.ex[ei].sets[si];const r=await dialog({title:'¿Borrar serie '+(si+1)+'?',text:setTxt(D.ex[ei].id,s),buttons:[{label:'Borrar serie',cls:'danger',v:1},{label:'Cancelar',v:0}]});if(r){D.ex[ei].sets.splice(si,1);persist();renderWorkout()}return}
  if(a==='wtoggle'&&D){const ei=+b.dataset.e;D.wOpen=D.wOpen||{};const cur=D.wOpen[ei]!=null?D.wOpen[ei]:ei===0;D.wOpen[ei]=!cur;persistSoon();updateWarm(ei);return}
  if(a==='wu'&&D){const ei=+b.dataset.e,i=+b.dataset.i;D.warm=D.warm||{};const w=D.warm[ei]=D.warm[ei]||[];w[i]=!w[i];persistSoon();updateWarm(ei);return}
  if(a==='swap'&&D){const ei=+b.dataset.e,e=D.ex[ei],t=DAY[D.day].items[ei],orig=t[0];
    const opts=[orig,...(ALT[orig]||[])].filter(x=>x!==e.id);
    const r=await dialog({title:'Cambiar ejercicio',text:'Alternativas que trabajan lo mismo. Solo cambia en esta sesión.',buttons:[...opts.map(x=>({label:(x===orig?'Volver a ':'')+EX[x].n,cls:x===orig?'ghost':'ghost',v:x})),{label:'Cancelar',v:null}]});
    if(!r)return;
    if(e.sets.length){const c=await dialog({title:'¿Cambiar igualmente?',text:`Se borrarán las ${e.sets.length} series apuntadas de ${EX[e.id].n}.`,buttons:[{label:'Cambiar',cls:'danger',v:1},{label:'Cancelar',v:0}]});if(!c)return}
    const sg=suggest(r,{sets:t[1],min:t[2],max:t[3]});e.id=r;e.sets=[];e.cur={kg:sg.kg==null?(EX[r].bar?20:10):sg.kg,reps:sg.reps};if(D.warm)delete D.warm[ei];
    persist();renderWorkout();toast('Cambiado a '+EX[r].n);return}
  if(a==='rest-minus'&&D&&D.restEnd){D.restEnd-=15000;persist();tick();return}
  if(a==='rest-plus'&&D&&D.restEnd){D.restEnd+=15000;D.restTotal+=15;persist();tick();return}
  if(a==='rest-skip'&&D){D.restEnd=null;persist();hideRest();return}
  if(a==='week'){UI.week=b.dataset.k;render();return}
  if(a==='delsess'){const r=await dialog({title:'¿Borrar sesión?',text:'Se borrará del historial y de las comparativas.',buttons:[{label:'Borrar',cls:'danger',v:1},{label:'Cancelar',v:0}]});if(r){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);persist();render();toast('Sesión borrada')}return}
  if(a==='rtype'){UI.run.type=b.dataset.t;b.parentElement.querySelectorAll('.chipb').forEach(c=>c.classList.toggle('on',c===b));return}
  if(a==='delrun'){const r=await dialog({title:'¿Borrar carrera?',text:'Se quitará de tus estadísticas.',buttons:[{label:'Borrar',cls:'danger',v:1},{label:'Cancelar',v:0}]});if(r){S.runs=S.runs.filter(x=>x.id!==b.dataset.id);persist();render();toast('Carrera borrada')}return}
  if(a==='bwr'){UI.bwRange=+b.dataset.v;render();return}
  if(a==='bwedit'){UI.bwEdit=b.dataset.d;render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='bwdel'){S.body=S.body.filter(x=>x.d!==b.dataset.d);UI.bwEdit=null;persist();render();toast('Registro borrado');return}
});
document.addEventListener('change',e=>{if(e.target.id==='bwDate'){UI.bwEdit=e.target.value||today();render()}if(e.target.id==='runDate'){UI.run.date=e.target.value||today()}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='bwForm'){const kg=num(document.querySelector('[data-sf="bw"]').value);const d=$('#bwDate').value||today();
    if(isNaN(kg)||kg<30||kg>300){toast('Escribe un peso válido, por ejemplo 72,4');return}
    const prev=S.body.find(x=>x.d===d);const v=Math.round(kg*10)/10;if(prev)prev.kg=v;else S.body.push({d,kg:v});
    S.body.sort((a,b)=>a.d<b.d?-1:1);UI.bwEdit=null;persist();render();toast(prev?'Peso actualizado':'Peso guardado')}
  if(e.target.id==='runForm'){const R=UI.run;const sec=R.min*60+R.sec;if(!(R.km>0)||sec<60){toast('Pon la distancia y el tiempo');return}
    S.runs.push({id:'r'+Date.now().toString(36),date:R.date||today(),km:Math.round(R.km*100)/100,sec,type:R.type,ts:Date.now()});persist();R.date=today();render();toast(`Carrera guardada · ${mmss(sec/R.km)} /km`)}
});
function route(){const h=location.hash.replace('#','');UI.view=VIEWS[h]?h:'inicio';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ================= Grano de película ================= */
(function(){const c=$('#grain'),x=c.getContext('2d');c.width=c.height=140;const img=x.createImageData(140,140);const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function draw(){const a=img.data;for(let i=0;i<a.length;i+=4){const v=Math.random()*255|0;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}x.putImageData(img,0,0)}
 draw();if(!red){let last=0;(function loop(ts){if(ts-last>90){draw();last=ts}requestAnimationFrame(loop)})(0)}})();

load();route();if(S.draft&&!location.hash)openWorkout();
</script>
</body>
</html>
