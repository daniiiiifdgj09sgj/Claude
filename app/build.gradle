plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hierro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hierro.app'
        minSdk 26
        targetSdk 35
        // GitHub Actions pasa el número de ejecución para que cada APK sea una versión nueva
        def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer
        versionCode = vc
        versionName = "1.0." + vc
    }

    signingConfigs {
        // La clave NO está en el repo: GitHub Actions la crea desde el secreto HIERRO_KEYSTORE
        hierro {
            storeFile file(System.getenv('HIERRO_KEYSTORE_FILE') ?: 'no-existe.p12')
            storeType 'pkcs12'
            storePassword System.getenv('HIERRO_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'hierro'
            keyPassword System.getenv('HIERRO_KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.hierro
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
