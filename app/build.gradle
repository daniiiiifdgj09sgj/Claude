plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hierro.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hierro.app'
        minSdk 26
        targetSdk 35
        // GitHub Actions pasa el número de ejecución para que cada APK sea una versión nueva
        def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer
        versionCode = vc
        versionName = "1.0." + vc
    }

    signingConfigs {
        // Clave fija: así cada APK nuevo se instala encima del anterior sin borrar tus datos
        hierro {
            storeFile rootProject.file('keystore/hierro.keystore')
            storePassword 'hierro123'
            keyAlias 'hierro'
            keyPassword 'hierro123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.hierro
        }
        debug {
            signingConfig signingConfigs.hierro
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
