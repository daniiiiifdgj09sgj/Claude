name: Compilar APK de Hierro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Hierro-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hierro-v${{ github.run_number }}
          path: Hierro-v${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hierro v${{ github.run_number }}
          body: |
            Descarga **Hierro-v${{ github.run_number }}.apk** desde el móvil e instálalo.
            Se instala encima de la versión anterior sin borrar tus entrenos.
          files: Hierro-v${{ github.run_number }}.apk
